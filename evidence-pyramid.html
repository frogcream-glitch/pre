<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>근거의 피라미드</title>
  <style>
/* ── 웹폰트 ── */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

:root {
  --bg:              #ffffff;
  --bg-secondary:    #f7f5f5;
  --bg-elevated:     #ffffff;
  --label:           #1d1d1f;
  --label-secondary: #6e6e73;
  --label-tertiary:  #86868b;
  --separator:       rgba(0, 0, 0, .10);
  --fill-hover:      rgba(0, 0, 0, .04);
  --accent:          #862633;
  --accent-emphasis: #6b1e29;
  --accent-fill:     rgba(134, 38, 51, .07);
  --shadow-card:     0 1px 3px rgba(0, 0, 0, .04);
  --shadow-float:    0 8px 28px rgba(0, 0, 0, .12);
  --code-bg:         #f7f5f5;
  --material:        rgba(255, 255, 255, .72);

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "SF Pro Display", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --type-hero:    clamp(34px, 3.8vw, 56px);
  --type-display: clamp(26px, 2.8vw, 40px);
  --type-title:   clamp(19px, 1.6vw, 24px);
  --type-lead:    clamp(17px, 1.4vw, 20px);
  --type-body:    17px;
  --type-caption: 13px;
  --type-label:   12px;

  --tracking-hero:  -.025em;
  --tracking-title: -.02em;
  --tracking-body:  -.01em;
  --tracking-label:  .06em;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --safe-x: clamp(24px, 5.2vw, 80px);
  --safe-y: clamp(20px, 3.2vh, 42px);
  --sidebar-w: 280px;
  --measure: 940px;

  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 22px; --r-pill: 980px;
  --ease: cubic-bezier(.28, .11, .32, 1);
  --dur-fast: .18s; --dur: .3s; --dur-slow: .5s;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--type-body);
  letter-spacing: var(--tracking-body);
  background: var(--bg-secondary);
  color: var(--label);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

.icon {
  width: 20px; height: 20px;
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── 레이아웃 ── */
.app { display: flex; height: 100vh; }

/* ── 사이드바 ── */
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--separator);
  transition: margin-left var(--dur) var(--ease), opacity var(--dur-fast) var(--ease);
}
body.is-collapsed .sidebar { margin-left: calc(var(--sidebar-w) * -1); opacity: 0; }

.sidebar__head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-5) 20px var(--sp-4);
}
.sidebar__eyebrow {
  font-size: var(--type-label); font-weight: 600; letter-spacing: var(--tracking-label);
  color: var(--accent); text-transform: uppercase; margin-bottom: var(--sp-1);
}
.sidebar__title { font-size: 19px; font-weight: 700; letter-spacing: var(--tracking-title); }

.icon-btn {
  display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: var(--r-sm);
  color: var(--label-secondary);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn:hover { background: var(--accent-fill); color: var(--accent); }

.stage__expand {
  position: absolute; top: 14px; left: 14px; z-index: 5;
  opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease);
}
body.is-collapsed .stage__expand { opacity: 1; pointer-events: auto; }

/* ── 사이드바 내비 ── */
.sidebar__nav {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 0 14px var(--sp-4);
  scrollbar-width: thin;
}
.sidebar__nav::-webkit-scrollbar { width: 6px; }
.sidebar__nav::-webkit-scrollbar-thumb { background: var(--separator); border-radius: 3px; }

.nav__item {
  position: relative;
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; text-align: left;
  padding: 10px var(--sp-3); margin-bottom: 2px;
  border-radius: var(--r-md);
  transition: background var(--dur-fast) var(--ease);
}
.nav__item:hover { background: var(--fill-hover); }
.nav__item.is-active { background: var(--accent-fill); }
.nav__item.is-active::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 3px; height: 22px; margin-top: -11px;
  border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav__item.is-active .nav__name { color: var(--accent); }
.nav__text { display: block; min-width: 0; }
.nav__name { display: block; font-size: 15px; font-weight: 600; letter-spacing: var(--tracking-body); }
.nav__desc {
  display: block;
  font-size: var(--type-caption); font-weight: 400; color: var(--label-secondary); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── 진행률 ── */
.sidebar__foot { padding: var(--sp-4) 20px 18px; border-top: 1px solid var(--separator); }
.progress__label {
  font-size: 11px; font-weight: 600; letter-spacing: var(--tracking-label);
  text-transform: uppercase; color: var(--label-tertiary);
}
.progress__track {
  height: 3px; border-radius: 2px; background: var(--separator);
  margin: var(--sp-2) 0 7px; overflow: hidden;
}
.progress__bar { height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width var(--dur) var(--ease); }
.progress__count { font-size: var(--type-caption); color: var(--label-secondary); font-variant-numeric: tabular-nums; }
.progress__count b { color: var(--label); font-weight: 600; }

/* ── 스테이지 ── */
.stage {
  position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.stage__topbar, .stage__footbar {
  display: flex; justify-content: space-between; align-items: center;
}
.stage__footbar { justify-content: flex-end; }
.stage__topbar, .stage__footbar {
  padding: var(--safe-y) var(--safe-x);
  font-size: var(--type-caption); font-weight: 400; color: var(--label-tertiary);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.stage__slide {
  flex: 1; min-height: 0; overflow: hidden;
  padding: 0 var(--safe-x);
  display: flex; flex-direction: column; justify-content: center;
}

@keyframes slide-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.slide { animation: slide-in var(--dur-slow) var(--ease) both; max-width: 1120px; width: 100%; }

/* ── 장표 텍스트 ── */
.slide__eyebrow {
  font-size: 15px; font-weight: 600; letter-spacing: var(--tracking-body);
  color: var(--accent); margin-bottom: 10px;
}
.slide__title {
  font-size: var(--type-hero); font-weight: 700;
  letter-spacing: var(--tracking-hero); line-height: 1.05;
  text-wrap: balance;
}
.slide__lead {
  font-size: var(--type-lead); font-weight: 500;
  letter-spacing: var(--tracking-title); line-height: 1.45;
  margin-top: var(--sp-5); color: var(--label-secondary);
  max-width: var(--measure);
  text-wrap: pretty;
}
.slide__lead b, .slide__lead strong { color: var(--label); font-weight: 600; }
.slide__body { margin-top: var(--sp-7); }
.slide__eyebrow + .slide__body { margin-top: var(--sp-4); }

/* ── 표지 ── */
.stage[data-layout="cover"]::after {
  content: "";
  position: absolute; top: -14%; right: -12%;
  width: min(52vw, 640px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(134, 38, 51, .15), rgba(134, 38, 51, .04) 62%, rgba(134, 38, 51, 0) 78%);
  pointer-events: none; z-index: 0;
}
.stage[data-layout="cover"]::before {
  content: "";
  position: absolute; bottom: -16%; right: 2%;
  width: min(34vw, 400px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(134, 38, 51, .07), rgba(134, 38, 51, 0) 70%);
  pointer-events: none; z-index: 0;
}
.stage__topbar, .stage__slide, .stage__footbar, .dock { position: relative; z-index: 1; }
.slide--cover .slide__title {
  font-size: clamp(38px, 4.6vw, 64px);
  line-height: 1.04;
  margin-top: var(--sp-2);
}
.slide--cover .slide__lead { margin-top: var(--sp-4); max-width: 620px; }
.slide--cover .slide__body { margin-top: var(--sp-6); }
.cover-info { display: grid; gap: 4px; }
.cover-info__name {
  font-size: 26px; font-weight: 700;
  letter-spacing: var(--tracking-title); color: var(--label);
}
.cover-info__sub {
  font-size: 17px; font-weight: 500;
  color: var(--accent);
}
.cover-info__when {
  font-size: var(--type-caption); font-weight: 400;
  color: var(--label-tertiary); margin-top: var(--sp-4);
  font-variant-numeric: tabular-nums;
}

/* ── 카드 ── */
.cards { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card {
  padding: var(--sp-5) 28px; border-radius: var(--r-lg);
  background: var(--bg-elevated); border: 1px solid var(--separator); box-shadow: var(--shadow-card);
}
.card__label {
  font-size: var(--type-caption); font-weight: 600; letter-spacing: .04em;
  color: var(--accent); margin-bottom: 10px;
}
.card__title { font-size: var(--type-title); font-weight: 600; letter-spacing: var(--tracking-title); line-height: 1.2; }
.card__body {
  font-size: var(--type-body); font-weight: 400; line-height: 1.6;
  color: var(--label-secondary); margin-top: 10px;
}

/* ── 불릿 ── */
.bullets { display: grid; gap: 18px; max-width: var(--measure); }
.bullet { display: flex; gap: 14px; align-items: baseline; }
.bullet__dot {
  flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); transform: translateY(-3px);
}
.bullet__text {
  font-size: clamp(17px, 1.5vw, 21px); font-weight: 400; line-height: 1.55;
  color: var(--label-secondary);
}
.bullet__text b, .bullet__text strong { color: var(--label); font-weight: 600; }

/* ── 피라미드 커스텀 ── */
.pyramid-wrapper {
  display: flex; justify-content: center; align-items: center;
  width: 100%; margin-top: var(--sp-5);
}
.pyramid-svg { max-width: 780px; width: 100%; height: auto; }

/* ── 키워드 테이블 ── */
.kw-table {
  width: 100%; max-width: var(--measure);
  border-collapse: separate; border-spacing: 0;
  border-radius: var(--r-lg); overflow: hidden;
  border: 1px solid var(--separator);
  font-size: 16px;
}
.kw-table thead th {
  background: var(--bg-secondary);
  padding: 14px 20px;
  font-weight: 600; font-size: 15px;
  text-align: left;
  color: var(--label);
  border-bottom: 1px solid var(--separator);
}
.kw-table tbody td {
  padding: 12px 20px;
  border-bottom: 1px solid var(--separator);
  vertical-align: top;
  line-height: 1.55;
  color: var(--label-secondary);
}
.kw-table tbody tr:last-child td { border-bottom: 0; }
.kw-table .kw-type {
  font-weight: 600; color: var(--label);
  white-space: nowrap;
}
.kw-tag {
  display: inline-block;
  padding: 3px 10px; margin: 2px 4px 2px 0;
  border-radius: var(--r-pill);
  background: var(--accent-fill); color: var(--accent);
  font-size: 14px; font-weight: 600;
  font-family: var(--font-mono);
}

/* ── 퀴즈 카드 ── */
.quiz-card {
  padding: var(--sp-5) 28px; border-radius: var(--r-lg);
  background: var(--bg-elevated); border: 1px solid var(--separator); box-shadow: var(--shadow-card);
  margin-bottom: 18px;
}
.quiz-card__num {
  font-size: var(--type-label); font-weight: 600; letter-spacing: .04em;
  color: var(--accent); margin-bottom: 10px;
}
.quiz-card__text {
  font-size: 16px; font-weight: 400; line-height: 1.6;
  color: var(--label-secondary); font-style: italic;
}
.quiz-card__answer {
  margin-top: var(--sp-3);
  font-size: 15px; font-weight: 600; color: var(--accent);
  display: none;
}
.quiz-card.show-answer .quiz-card__answer { display: block; }
.quiz-btn {
  margin-top: var(--sp-4);
  padding: 10px 22px; border-radius: var(--r-pill);
  border: 1px solid var(--accent); background: var(--accent-fill);
  font-size: 15px; font-weight: 600; color: var(--accent);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.quiz-btn:hover { background: var(--accent); color: #fff; }

/* ── 연구 방법론 설명 카드 ── */
.method-section { margin-top: var(--sp-5); }
.method-section__title {
  font-size: var(--type-title); font-weight: 700;
  letter-spacing: var(--tracking-title); line-height: 1.3;
  margin-bottom: var(--sp-4);
}
.method-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.method-card {
  padding: var(--sp-5) 28px; border-radius: var(--r-lg);
  background: var(--bg-elevated); border: 1px solid var(--separator); box-shadow: var(--shadow-card);
}
.method-card__label {
  font-size: var(--type-caption); font-weight: 600; letter-spacing: .04em;
  color: var(--accent); margin-bottom: 8px;
}
.method-card__title {
  font-size: 18px; font-weight: 600; letter-spacing: var(--tracking-title); line-height: 1.3;
  margin-bottom: 10px;
}
.method-card__body {
  font-size: 16px; font-weight: 400; line-height: 1.65;
  color: var(--label-secondary);
}
.method-card__body b { color: var(--label); font-weight: 600; }

/* clue reveal */
.clue-keyword { font-weight: 400; }
.clue-abstract.is-revealed .clue-keyword {
  font-weight: 700; color: var(--label);
  background: rgba(134,38,51,.10); padding: 1px 3px; border-radius: 4px;
}
.clue-reveal-btn {
  margin-top: var(--sp-4); padding: 10px 28px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  border: none; border-radius: 12px;
  background: var(--accent); color: #fff;
  transition: opacity .2s;
}
.clue-reveal-btn:hover { opacity: .85; }
.clue-reveal-btn.is-revealed { background: var(--label-tertiary); }
.clue-answer {
  margin-top: var(--sp-4); font-size: 15px;
  color: var(--accent); font-weight: 600;
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height .4s ease, opacity .3s ease;
}
.clue-answer.is-revealed { max-height: 300px; opacity: 1; }

/* statement */
.statement {
  font-size: var(--type-display); font-weight: 600;
  letter-spacing: var(--tracking-title); line-height: 1.3;
  padding-left: var(--sp-5); border-left: 3px solid var(--accent);
  text-wrap: balance;
}

/* ── 플로팅 독 ── */
.dock {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px;
  padding: 6px var(--sp-2); border-radius: var(--r-pill);
  background: var(--material);
  border: 1px solid var(--separator);
  box-shadow: var(--shadow-float);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  transition: opacity var(--dur) var(--ease);
}
.dock:not(:hover) { opacity: .55; }
.dock__btn {
  display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: 50%;
  color: var(--label);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
.dock__btn:hover { background: var(--accent-fill); color: var(--accent); }
.dock__btn:disabled { opacity: .28; cursor: default; }
.dock__btn:disabled:hover { background: none; color: var(--label); }

/* ── 반응형 ── */
@media (max-width: 860px) { :root { --sidebar-w: 240px; } }
@media (max-width: 640px) {
  .sidebar { position: fixed; z-index: 30; height: 100%; box-shadow: var(--shadow-float); }
  .stage__slide { justify-content: flex-start; padding-top: var(--sp-3); }
}
  </style>
</head>
<body>
  <div class="app">
    <!-- ── 사이드바 ── -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar__head">
        <div class="sidebar__brand">
          <p class="sidebar__eyebrow">2026 예방실습</p>
          <h1 class="sidebar__title">근거의 피라미드</h1>
        </div>
        <button class="icon-btn" id="collapseBtn" title="사이드바 접기" aria-label="사이드바 접기">
          <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
        </button>
      </header>

      <nav class="sidebar__nav" id="nav"></nav>

      <footer class="sidebar__foot">
        <p class="progress__label">Progress</p>
        <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
        <p class="progress__count"><b id="progressNow">1</b> / <span id="progressTotal"></span></p>
      </footer>
    </aside>

    <!-- ── 메인 스테이지 ── -->
    <main class="stage" id="stage">
      <button class="icon-btn stage__expand" id="expandBtn" title="사이드바 펼치기" aria-label="사이드바 펼치기">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
      </button>

      <div class="stage__topbar">
        <span id="crumbSection"></span>
        <span id="crumbDeck">근거의 피라미드</span>
      </div>

      <div class="stage__slide" id="slideContainer"></div>

      <div class="stage__footbar">
        <span id="footPage">01 / 14</span>
      </div>

      <!-- 플로팅 독 -->
      <div class="dock">
        <button class="dock__btn" id="prevBtn" title="이전 (←)" aria-label="이전 장표">
          <svg viewBox="0 0 24 24" class="icon"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="dock__btn" id="nextBtn" title="다음 (→)" aria-label="다음 장표">
          <svg viewBox="0 0 24 24" class="icon"><polyline points="9 6 15 12 9 18"></polyline></svg>
        </button>
      </div>
    </main>
  </div>

<script>
/* ── 슬라이드 데이터 ── */
const SLIDES = [
  {
    id: "cover",
    section: "표지",
    eyebrow: "예방한의학실습",
    title: "근거의 피라미드",
    lead: "초록만 보고 연구 유형을 구분하는 법 — 오늘 논문을 고를 때 바로 씁니다",
    layout: "cover",
    body: `<div class="cover-info">
      <p class="cover-info__name">예방한의학교실</p>
      <p class="cover-info__sub">근거중심의학(EBM) 기초</p>
    </div>`
  },
  {
    id: "problem",
    section: "도입",
    eyebrow: "도입 · 문제 상황",
    title: "같은 질문,\n다른 대답",
    lead: "\"침 치료가 요통에 효과가 있을까?\" — 두 논문이 반대 결론을 내렸다면, <b>어느 쪽을 믿어야 할까?</b>",
    layout: "cards",
    body: `<div class="cards">
      <div class="card">
        <p class="card__label">사례 A</p>
        <h3 class="card__title">증례보고</h3>
        <p class="card__body">"침 치료 후 환자 3명의 통증이 감소했다"<br><br>비교군 없음 · 치료자가 직접 평가 · 대상자 3명</p>
      </div>

          "We <span class="clue-keyword">systematically searched</span> PubMed, EMBASE, and the Cochrane Library for <span class="clue-keyword">randomized controlled trials</span> evaluating acupuncture for migraine prophylaxis. Of 1,842 records identified, <span class="clue-keyword">22 trials (n=4,985)</span> met the inclusion criteria. <span class="clue-keyword">Meta-analysis</span> showed that acupuncture was associated with a significant reduction in migraine frequency (MD −1.56 days/month, 95% CI −2.21 to −0.91)."

          ✓ "Meta-analysis", MD, 95% CI — 통계적 통합
        </div>
      </div>
    </div>`
  },
  {
    id: "signal-words",
    section: "초록 읽기",
    eyebrow: "초록 읽기 · 신호 단어",
    title: "Methods에서\n유형을 읽는 신호",
    lead: "제목만으로는 부족합니다. <b>Methods 키워드</b>가 연구 유형을 결정합니다",
    layout: "custom",
    body: `<table class="kw-table">

        <tr><td class="kw-type">RCT</td><td><span class="kw-tag">randomized</span><span class="kw-tag">randomly assigned</span><span class="kw-tag">control group</span><span class="kw-tag">blinded</span><span class="kw-tag">placebo</span><span class="kw-tag">sham</span><span class="kw-tag">CONSORT</span></td></tr>
        <tr><td class="kw-type">SR / 메타분석</td><td><span class="kw-tag">systematic review</span><span class="kw-tag">systematically searched</span><span class="kw-tag">meta-analysis</span><span class="kw-tag">inclusion criteria</span><span class="kw-tag">PRISMA</span><span class="kw-tag">forest plot</span></td></tr>

    layout: "custom",

        <p class="quiz-card__answer">→ 증례보고 (Case Report) — "a 62-year-old male" 한 명, 비교군·통계 없음</p>

/* ── 렌더링 엔진 ── */
let current = 0;

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '';
  let lastSection = '';
  SLIDES.forEach((s, i) => {
    if (s.section !== lastSection) {
      lastSection = s.section;
    }
    const title = (s.title || '').replace(/\n/g, ' ');
    html += `<button class="nav__item" data-index="${i}">
      <span class="nav__text">
        <span class="nav__name">${title}</span>
        <span class="nav__desc">${s.section}</span>
      </span>
    </button>`;
  });
  nav.innerHTML = html;
  document.getElementById('progressTotal').textContent = SLIDES.length;
}

function renderSlide(index) {
  const s = SLIDES[index];
  const container = document.getElementById('slideContainer');
  const stage = document.getElementById('stage');

  stage.removeAttribute('data-layout');
  if (s.layout === 'cover') stage.setAttribute('data-layout', 'cover');

  const nl2br = (str) => String(str || '').replace(/\n/g, '<br>');

  container.innerHTML = `
    <article class="slide slide--${s.layout}" id="slide-${s.id}">
      ${s.eyebrow ? `<p class="slide__eyebrow">${s.eyebrow}</p>` : ''}
      ${s.title ? `<h2 class="slide__title">${nl2br(s.title)}</h2>` : ''}
      ${s.lead ? `<p class="slide__lead">${s.lead}</p>` : ''}
      ${s.body ? `<div class="slide__body">${s.body}</div>` : ''}
    </article>`;

  // Update chrome
  document.getElementById('crumbSection').textContent = s.section;
  document.getElementById('footPage').textContent =
    `${String(index + 1).padStart(2, '0')} / ${SLIDES.length}`;
  document.getElementById('progressBar').style.width =
    `${((index + 1) / SLIDES.length) * 100}%`;
  document.getElementById('progressNow').textContent = index + 1;

  // Update nav
  document.querySelectorAll('.nav__item').forEach((el, i) => {
    el.classList.toggle('is-active', i === index);
  });

  // Update buttons
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === SLIDES.length - 1;

  current = index;
}

function go(index) {
  if (index < 0 || index >= SLIDES.length) return;
  renderSlide(index);
}

function revealClue(btn) {
  const card = btn.closest('.method-card');
  const abstract = card.querySelector('.clue-abstract');
  const answer = card.querySelector('.clue-answer');
  const revealed = abstract.classList.toggle('is-revealed');
  answer.classList.toggle('is-revealed', revealed);
  btn.classList.toggle('is-revealed', revealed);
  btn.textContent = revealed ? '정답 숨기기' : '정답 확인';
}

/* ── 이벤트 ── */
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  renderSlide(0);

  document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));

  document.getElementById('nav').addEventListener('click', (e) => {
    const btn = e.target.closest('.nav__item');
    if (btn) go(Number(btn.dataset.index));
  });

  document.getElementById('collapseBtn').addEventListener('click', () => {
    document.body.classList.add('is-collapsed');
  });
  document.getElementById('expandBtn').addEventListener('click', () => {
    document.body.classList.remove('is-collapsed');
  });

  // 키보드 네비게이션
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); go(current + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(current - 1); }
    if (e.key === '\\') { document.body.classList.toggle('is-collapsed'); }
  });
});
</script>
