<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산업재해 지표 계산 · 예방의학 실습</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

:root {
  --bg:#ffffff;--bg-secondary:#f3f6f5;--bg-elevated:#ffffff;
  --label:#15242B;--label-secondary:#3A4C52;--label-tertiary:#65767B;
  --separator:#D3DAD8;--fill-hover:rgba(14,90,82,.04);
  --accent:#0E5A52;--accent-emphasis:#094A43;--accent-fill:#E2EDEA;
  --amber:#A9740C;--amber-soft:#FAF0DC;
  --alert:#98352A;--alert-soft:#F8E7E4;
  --success:#1A7A3A;--success-soft:#E4F5EA;
  --shadow-card:0 1px 3px rgba(0,0,0,.04);
  --shadow-float:0 8px 28px rgba(0,0,0,.12);
  --material:rgba(255,255,255,.72);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --type-hero:clamp(34px,3.8vw,56px);--type-display:clamp(26px,2.8vw,40px);
  --type-title:clamp(19px,1.6vw,24px);--type-lead:clamp(17px,1.4vw,20px);
  --type-body:17px;--type-caption:13px;--type-label:12px;
  --tracking-hero:-.025em;--tracking-title:-.02em;--tracking-body:-.01em;--tracking-label:.06em;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;
  --safe-x:clamp(24px,5.2vw,80px);--safe-y:clamp(20px,3.2vh,42px);
  --sidebar-w:280px;--measure:940px;
  --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:22px;--r-pill:980px;
  --ease:cubic-bezier(.28,.11,.32,1);--dur-fast:.18s;--dur:.3s;--dur-slow:.5s;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:var(--type-body);letter-spacing:var(--tracking-body);background:var(--bg-secondary);color:var(--label);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);display:flex;flex-direction:column;background:var(--bg-secondary);border-right:1px solid var(--separator);transition:margin-left var(--dur) var(--ease),opacity var(--dur-fast) var(--ease)}
body.is-collapsed .sidebar{margin-left:calc(var(--sidebar-w)*-1);opacity:0}
.sidebar__head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-5) 20px var(--sp-4)}
.sidebar__eyebrow{font-size:var(--type-label);font-weight:600;letter-spacing:var(--tracking-label);color:var(--accent);text-transform:uppercase;margin-bottom:var(--sp-1)}
.sidebar__title{font-size:19px;font-weight:700;letter-spacing:var(--tracking-title)}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-sm);color:var(--label-tertiary);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.icon-btn:hover{background:var(--accent-fill);color:var(--accent)}
.stage__expand{position:absolute;top:14px;left:14px;z-index:5;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
body.is-collapsed .stage__expand{opacity:1;pointer-events:auto}
.sidebar__nav{flex:1;min-height:0;overflow-y:auto;padding:0 14px var(--sp-4);scrollbar-width:thin}
.sidebar__nav::-webkit-scrollbar{width:6px}
.sidebar__nav::-webkit-scrollbar-thumb{background:var(--separator);border-radius:3px}
.nav__group{display:flex;align-items:center;gap:var(--sp-2);width:100%;text-align:left;font-size:11px;font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--label-tertiary);padding:var(--sp-4) var(--sp-2) var(--sp-2);transition:color var(--dur-fast) var(--ease)}
.nav__group:hover{color:var(--label)}
.nav__item{position:relative;display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;padding:8px var(--sp-3);margin-bottom:1px;border-radius:var(--r-md);transition:background var(--dur-fast) var(--ease)}
.nav__item:hover{background:var(--fill-hover)}
.nav__item.is-active{background:var(--accent-fill)}
.nav__item.is-active::before{content:"";position:absolute;left:0;top:50%;width:3px;height:22px;margin-top:-11px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav__item.is-active .nav__name{color:var(--accent)}
.nav__text{display:block;min-width:0}
.nav__name{display:block;font-size:14px;font-weight:600;letter-spacing:var(--tracking-body)}
.nav__desc{display:block;font-size:var(--type-caption);font-weight:400;color:var(--label-tertiary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar__foot{padding:var(--sp-4) 20px 18px;border-top:1px solid var(--separator)}
.progress__label{font-size:11px;font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--label-tertiary)}
.progress__track{height:3px;border-radius:2px;background:var(--separator);margin:var(--sp-2) 0 7px;overflow:hidden}
.progress__bar{height:100%;width:0;border-radius:2px;background:var(--accent);transition:width var(--dur) var(--ease)}
.progress__count{font-size:var(--type-caption);color:var(--label-secondary);font-variant-numeric:tabular-nums}
.progress__count b{color:var(--label);font-weight:600}

.stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.stage__topbar,.stage__footbar{display:flex;justify-content:space-between;align-items:center;padding:var(--safe-y) var(--safe-x);font-size:var(--type-caption);font-weight:400;color:var(--label-tertiary);font-variant-numeric:tabular-nums;flex:0 0 auto}
.stage__footbar{justify-content:flex-end}
.stage__slide{flex:1;min-height:0;overflow:hidden;padding:0 var(--safe-x);display:flex;flex-direction:column;justify-content:center}
.stage__slide.scrollable{overflow-y:auto;justify-content:flex-start;padding-top:var(--sp-5);padding-bottom:var(--sp-8)}
@keyframes slide-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide{animation:slide-in var(--dur-slow) var(--ease) both;max-width:1120px;width:100%}

.slide__eyebrow{font-size:15px;font-weight:600;letter-spacing:var(--tracking-body);color:var(--accent);margin-bottom:10px}
.slide__title{font-size:var(--type-hero);font-weight:700;letter-spacing:var(--tracking-hero);line-height:1.05;text-wrap:balance}
.slide__lead{font-size:var(--type-lead);font-weight:500;letter-spacing:var(--tracking-title);line-height:1.45;margin-top:var(--sp-5);color:var(--label-secondary);max-width:var(--measure);text-wrap:pretty}
.slide__lead b{color:var(--label);font-weight:600}
.slide__body{margin-top:var(--sp-6)}

.stage[data-layout="cover"]::after{content:"";position:absolute;top:-14%;right:-12%;width:min(52vw,640px);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(14,90,82,.12),rgba(14,90,82,.03) 62%,rgba(14,90,82,0) 78%);pointer-events:none;z-index:0}
.stage[data-layout="cover"]::before{content:"";position:absolute;bottom:-16%;right:2%;width:min(34vw,400px);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(14,90,82,.06),rgba(14,90,82,0) 70%);pointer-events:none;z-index:0}
.stage__topbar,.stage__slide,.stage__footbar,.dock{position:relative;z-index:1}
.slide--cover .slide__title{font-size:clamp(38px,4.6vw,64px);line-height:1.04;margin-top:var(--sp-2)}
.slide--cover .slide__lead{margin-top:var(--sp-4);max-width:680px}
.slide--cover .slide__body{margin-top:var(--sp-6)}

.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:var(--sp-5)}
.flow span{background:var(--bg-elevated);border:1px solid var(--separator);border-radius:var(--r-pill);padding:9px 18px;font-size:15px;font-weight:500}
.flow i{font-style:normal;color:var(--label-tertiary);font-size:14px}

.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{padding:var(--sp-5) 28px;border-radius:var(--r-lg);background:var(--bg-elevated);border:1px solid var(--separator);box-shadow:var(--shadow-card)}
.card__label{font-size:var(--type-caption);font-weight:600;letter-spacing:.04em;color:var(--accent);margin-bottom:10px}
.card__title{font-size:var(--type-title);font-weight:600;letter-spacing:var(--tracking-title);line-height:1.2}
.card__body{font-size:16px;font-weight:400;line-height:1.65;color:var(--label-secondary);margin-top:10px}
.card__body b{color:var(--label);font-weight:600}

.bullets{display:grid;gap:16px;max-width:var(--measure)}
.bullet{display:flex;gap:14px;align-items:baseline}
.bullet__dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateY(-3px)}
.bullet__text{font-size:clamp(16px,1.4vw,19px);font-weight:400;line-height:1.55;color:var(--label-secondary)}
.bullet__text b{color:var(--label);font-weight:600}

.formula-box{background:#0F1D23;border-radius:var(--r-lg);padding:22px 28px;margin-bottom:16px;color:#DCE6E4;font-size:18px;font-weight:500;line-height:1.7;letter-spacing:.02em;text-align:center}
.formula-box .tag{color:#7FA8A0;font-size:var(--type-label);font-weight:600;margin-bottom:8px;display:block;text-align:left}

.data-table{width:100%;border-collapse:collapse;margin-top:16px}
.data-table th,.data-table td{padding:12px 16px;text-align:left;font-size:15px;line-height:1.5;border-bottom:1px solid var(--separator)}
.data-table th{background:var(--accent-fill);color:var(--accent);font-weight:700;font-size:var(--type-caption);letter-spacing:.04em;text-transform:uppercase}
.data-table td{color:var(--label-secondary)}
.data-table td b{color:var(--label);font-weight:600}
.data-table tr:last-child td{border-bottom:0}
.data-table-wrap{border:1px solid var(--separator);border-radius:var(--r-lg);overflow:hidden;background:var(--bg-elevated);box-shadow:var(--shadow-card)}

.answer-box{border-left:3px solid var(--success);background:var(--success-soft);padding:16px 20px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:16px;font-size:17px;line-height:1.6;color:var(--label-secondary)}
.answer-box b{color:var(--success);font-weight:700}
.solution-box{background:var(--bg-secondary);border-radius:var(--r-lg);padding:20px 24px;margin-top:16px;font-size:15px;line-height:1.75;color:var(--label-secondary)}
.solution-box b{color:var(--label);font-weight:600}
.solution-box .step-label{color:var(--accent);font-weight:700;font-size:var(--type-caption);letter-spacing:.04em;margin-bottom:4px;display:block}

.note-box{border-left:3px solid var(--amber);background:var(--amber-soft);padding:14px 18px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:16px;font-size:15px;line-height:1.6;color:var(--label-secondary)}
.note-box b{color:var(--label);font-weight:700}

.case-text{background:var(--bg-secondary);border-radius:var(--r-lg);padding:22px 26px;font-size:15px;line-height:1.75;color:var(--label-secondary);max-height:400px;overflow-y:auto}
.case-text b{color:var(--label);font-weight:600}

.contrast-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:16px}
.contrast-grid>div{background:var(--bg-secondary);border-radius:var(--r-sm);padding:16px 18px;font-size:15px;line-height:1.6;color:var(--label-secondary)}
.contrast-grid h4{margin:0 0 8px;font-size:var(--type-caption);font-weight:700;letter-spacing:.04em}
.contrast-grid .con{border-left:3px solid var(--alert)}.contrast-grid .con h4{color:var(--alert)}
.contrast-grid .pro{border-left:3px solid var(--success)}.contrast-grid .pro h4{color:var(--success)}

.ladder{border:1px solid var(--separator);border-radius:var(--r-lg);overflow:hidden;background:var(--bg-elevated)}
.ladder .row{border-bottom:1px solid var(--separator)}.ladder .row:last-child{border-bottom:0}
.ladder .row-btn{width:100%;text-align:left;background:none;border:0;font:inherit;cursor:pointer;padding:14px 20px;display:flex;gap:14px;align-items:center;color:var(--label);transition:background var(--dur-fast) var(--ease)}
.ladder .row-btn:hover{background:#F6F9F8}
.step-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-fill);color:var(--accent);font-size:var(--type-caption);font-weight:700;display:grid;place-items:center}
.ladder .row-body{display:none;padding:0 20px 16px 60px;color:var(--label-secondary);font-size:15px;line-height:1.6}
.ladder .row.open .row-body{display:block}
.ladder .row.open .row-btn{background:#F6F9F8}
.chev{margin-left:auto;color:var(--label-tertiary);font-size:var(--type-caption)}

/* ── 정답 버튼 ── */
.reveal-wrap{margin-top:20px}
.reveal-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 24px;border-radius:var(--r-md);
  background:var(--accent);color:#fff;font-size:15px;font-weight:600;
  transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);
  box-shadow:0 2px 8px rgba(14,90,82,.25);
}
.reveal-btn:hover{background:var(--accent-emphasis);transform:translateY(-1px)}
.reveal-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reveal-content{
  display:none;margin-top:16px;
  animation:slide-in var(--dur) var(--ease) both;
}
.reveal-content.show{display:block}
.reveal-btn.used{background:var(--label-tertiary);box-shadow:none;pointer-events:none}

/* ── Q 블록 ── */
.q-block{
  background:var(--bg-elevated);border:1px solid var(--separator);border-radius:var(--r-lg);
  padding:20px 24px;margin-bottom:18px;box-shadow:var(--shadow-card);
}
.q-label{font-size:var(--type-caption);font-weight:700;letter-spacing:.04em;color:var(--accent);margin-bottom:8px}
.q-text{font-size:16px;font-weight:500;line-height:1.6;color:var(--label)}
.q-hint{font-size:14px;color:var(--label-tertiary);margin-top:6px}
.q-answer-table{width:100%;border-collapse:collapse;margin-top:12px}
.q-answer-table td{padding:10px 14px;font-size:15px;line-height:1.55;border-bottom:1px dashed var(--separator);color:var(--label-secondary);vertical-align:top}
.q-answer-table td:first-child{font-weight:600;color:var(--accent);width:120px}
.q-answer-table tr:last-child td{border-bottom:0}

.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:var(--r-pill);text-transform:uppercase}
.badge--prof{background:var(--accent);color:#fff}
.badge--student{background:var(--accent-fill);color:var(--accent)}

.dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px var(--sp-2);border-radius:var(--r-pill);background:var(--material);border:1px solid var(--separator);box-shadow:var(--shadow-float);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);transition:opacity var(--dur) var(--ease)}
.dock:not(:hover){opacity:.55}
.dock__btn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--label);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease)}
.dock__btn:hover{background:var(--accent-fill);color:var(--accent)}
.dock__btn:disabled{opacity:.28;cursor:default}
.dock__btn:disabled:hover{background:none;color:var(--label)}

@media(max-width:1100px){.contrast-grid{grid-template-columns:1fr}}
@media(max-width:860px){:root{--sidebar-w:240px}}
@media(max-width:640px){.sidebar{position:fixed;z-index:30;height:100%;box-shadow:var(--shadow-float)}.stage__slide{justify-content:flex-start;padding-top:var(--sp-3)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <header class="sidebar__head">
      <div class="sidebar__brand">
        <p class="sidebar__eyebrow">예방의학 실습</p>
        <h1 class="sidebar__title">산업재해 지표 계산</h1>
      </div>
      <button class="icon-btn" id="collapseBtn" title="사이드바 접기" aria-label="사이드바 접기">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
      </button>
    </header>
    <nav class="sidebar__nav" id="nav"></nav>
    <footer class="sidebar__foot">
      <p class="progress__label">Progress</p>
      <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
      <p class="progress__count"><b id="progressNow">1</b> / <span id="progressTotal"></span></p>
    </footer>
  </aside>
  <main class="stage" id="stage">
    <button class="icon-btn stage__expand" id="expandBtn" title="사이드바 펼치기" aria-label="사이드바 펼치기">
      <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
    </button>
    <div class="stage__topbar">
      <span id="crumbSection"></span>
      <span><span class="badge badge--prof">교수용</span> &nbsp; 산업재해 지표 계산</span>
    </div>
    <div class="stage__slide" id="slideContainer"></div>
    <div class="stage__footbar"><span id="footPage"></span></div>
    <div class="dock">
      <button class="dock__btn" id="prevBtn" title="이전 (←)"><svg viewBox="0 0 24 24" class="icon"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="dock__btn" id="nextBtn" title="다음 (→)"><svg viewBox="0 0 24 24" class="icon"><polyline points="9 6 15 12 9 18"></polyline></svg></button>
    </div>
  </main>
</div>

<script>
/* ── 정답 토글 헬퍼 ── */
function revealAnswer(btn){
  const wrap=btn.parentElement;
  const content=wrap.querySelector('.reveal-content');
  content.classList.add('show');
  btn.classList.add('used');
  btn.innerHTML='정답 확인 완료';
}
const REVEAL=`<button class="reveal-btn" onclick="revealAnswer(this)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>정답 확인</button>`;

const SLIDES=[
/* ───── 표지 ───── */
{
  id:"cover",section:"표지",layout:"cover",
  eyebrow:"예방의학 및 실습 · 실습 9–10",
  title:"산업재해 지표 계산",
  lead:"도수율 · 강도율 · 장해등급을 직접 계산하고,\n산재보험 심사 사례를 분석합니다.",
  body:`<div class="flow"><span>개념 학습</span><i>→</i><span>도수율 · 강도율</span><i>→</i><span>장해등급</span><i>→</i><span>종합 문제</span><i>→</i><span>사례 분석</span></div>`
},

/* ───── 개념 1 ───── */
{
  id:"freq-rate",section:"개념",eyebrow:"개념 1",
  title:"도수율\n(Frequency Rate)",
  lead:"<b>100만 근로시간당 재해 발생건수</b>를 나타내는 지표입니다.",
  body:`<div class="formula-box"><span class="tag">공식</span>도수율 = 재해 발생건수 ÷ 연간 총 근로시간 × 1,000,000</div>
  <div class="bullets">
    <div class="bullet"><span class="bullet__dot"></span><p class="bullet__text"><b>의미:</b> 100만 근로시간당 재해 발생건수</p></div>
    <div class="bullet"><span class="bullet__dot"></span><p class="bullet__text"><b>단위:</b> 건/백만 근로시간</p></div>
    <div class="bullet"><span class="bullet__dot"></span><p class="bullet__text"><b>활용:</b> 재해 발생 빈도 비교 (사업장 간, 연도 간)</p></div>
    <div class="bullet"><span class="bullet__dot"></span><p class="bullet__text"><b>분모:</b> 연간 총 근로시간 = 근로자 수 × 1인당 연간 근로시간</p></div>
  </div>`
},
/* ───── 개념 2 ───── */
{
  id:"sev-rate",section:"개념",eyebrow:"개념 2",
  title:"강도율\n(Severity Rate)",

    <p class="q-text">자문의 B의 논리에 따르면, 공백기 동안 다른 일을 하지 않은 것이 왜 '업무 관련성'을 입증하는 데 유리한 증거가 되었을까요?<br><span class="q-hint">Hint: 만약 이 기간에 배달 일을 하거나 다른 무거운 짐을 들었다면 위원회는 뭐라고 했을까요?</span></p>
    <div class="reveal-wrap">${REVEAL}<div class="reveal-content">
      <div class="solution-box"><span class="step-label">모범답안</span>공백기에 다른 육체노동을 하지 않았다는 것은, 질병의 원인이 될 만한 '새로운 외부 요인'이 개입되지 않았음을 뜻함. 즉, 현재의 허리 상태는 오로지 과거 17년간의 철근공 업무에서 기인한 것임을 역설적으로 증명하는 <b>'순수한 누적 효과'</b>의 증거가 됨.</div>
    </div></div>
  </div>

  <div class="q-block">
    <p class="q-label">Q4</p>
    <p class="q-text">"2021년 이전에는 요추 부위 치료 이력이 확인되지 않음"이라는 문구에 대해 두 전문가 그룹의 해석이 정반대입니다.</p>
    <div class="contrast-grid" style="margin-bottom:12px">
      <div class="con"><h4>판정위원회 (다수)</h4>"기록이 없으니 병이 생길 정도로 힘든 일을 장기간 했다고 보기 미흡하다."</div>
      <div class="pro"><h4>자문의 B (본부)</h4>"17년 넘게 3만 톤을 날랐는데 기록이 없다는 건, 오히려 참고 일했을 만큼 인과관계가 확실하다는 뜻이다."</div>
    </div>
    <p class="q-text">여러분이 주치의라면 어느 해석이 더 '임상적'으로 타당하다고 생각하나요? 그 이유는?</p>
    <div class="reveal-wrap">${REVEAL}<div class="reveal-content">
      <div class="solution-box"><span class="step-label">모범답안</span><b>자문의 B의 해석이 임상적으로 훨씬 타당함.</b><br><br>
        이유: 의료 이용 기록은 환자의 실제 상태를 반영하는 '절대적 지표'가 아니라, 환자의 의료 접근성과 경제적 상황에 좌우되는 데이터임. 17년간 하루 9톤의 철근을 다룬 숙련된 육체 노동자들은 경미한 통증을 '직업적 숙명'으로 받아들이며 약국 파스나 자가 휴식으로 견디는 경향(Under-reporting)이 강함. 따라서 '병원에 가지 않았다'는 기록을 '아프지 않았다'는 근거로 활용하는 것은 <b>임상 현장의 특수성을 무시한 행정 편의적 해석</b>임.</div>
    </div></div>
  </div>

  <div class="q-block">
    <p class="q-label">Q5</p>
    <p class="q-text">산업재해보상보험심사위원회는 결국 누구의 손을 들어주었을까요?</p>
    <div class="reveal-wrap">${REVEAL}<div class="reveal-content">
      <div class="answer-box"><b>최종 결정:</b> 원처분 <b>취소</b> → 업무상 질병 <b>승인</b><br><b>결정적 사유:</b> <b>17년 6개월</b>이라는 장기간의 직력과 그에 따른 <b>높은 신체 부담</b>을 인정함.</div>
    </div></div>
  </div>`
}
];

/* ───── 엔진 ───── */
let cur=0;
function buildNav(){
  const nav=document.getElementById('nav');let lastSec='';
  SLIDES.forEach((s,i)=>{
    if(s.section!==lastSec){const g=document.createElement('button');g.className='nav__group';g.textContent=s.section;g.onclick=()=>go(i);nav.appendChild(g);lastSec=s.section}
    const btn=document.createElement('button');btn.className='nav__item';btn.id='nav-'+i;
    btn.innerHTML=`<span class="nav__text"><span class="nav__name">${s.eyebrow||s.section}</span></span>`;
    btn.onclick=()=>go(i);nav.appendChild(btn);
  });
  document.getElementById('progressTotal').textContent=SLIDES.length;
}
function renderSlide(index){
  const s=SLIDES[index];cur=index;
  document.getElementById('stage').setAttribute('data-layout',s.layout||'');
  const c=document.getElementById('slideContainer');
  c.className='stage__slide'+(s.scrollable?' scrollable':'');
  c.innerHTML=`<div class="slide ${s.layout==='cover'?'slide--cover':''}" key="${index}">
    ${s.eyebrow?`<p class="slide__eyebrow">${s.eyebrow}</p>`:''}
    <h2 class="slide__title">${s.title}</h2>
    ${s.lead?`<p class="slide__lead">${s.lead}</p>`:''}
    ${s.body?`<div class="slide__body">${s.body}</div>`:''}
  </div>`;
  document.getElementById('crumbSection').textContent=s.section;
  document.getElementById('footPage').textContent=`${String(index+1).padStart(2,'0')} / ${SLIDES.length}`;
  document.getElementById('progressBar').style.width=`${((index+1)/SLIDES.length)*100}%`;
  document.getElementById('progressNow').textContent=index+1;
  document.querySelectorAll('.nav__item').forEach((el,i)=>{el.classList.toggle('is-active',i===index)});
  const an=document.getElementById('nav-'+index);if(an)an.scrollIntoView({block:'nearest',behavior:'smooth'});
  document.getElementById('prevBtn').disabled=index===0;
  document.getElementById('nextBtn').disabled=index===SLIDES.length-1;
}
function go(i){if(i>=0&&i<SLIDES.length)renderSlide(i)}
function toggleRow(btn){const r=btn.parentElement;r.classList.toggle('open');btn.querySelector('.chev').textContent=r.classList.contains('open')?'접기':'펼치기'}

document.getElementById('prevBtn').onclick=()=>go(cur-1);
document.getElementById('nextBtn').onclick=()=>go(cur+1);
document.getElementById('collapseBtn').onclick=()=>document.body.classList.add('is-collapsed');
document.getElementById('expandBtn').onclick=()=>document.body.classList.remove('is-collapsed');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1)});

buildNav();renderSlide(0);
</script>
</body>
</html>
