<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근거중심 답변찾기 · 예방의학 실습</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

:root {
  --bg:              #ffffff;
  --bg-secondary:    #f3f6f5;
  --bg-elevated:     #ffffff;
  --label:           #15242B;
  --label-secondary: #3A4C52;
  --label-tertiary:  #65767B;
  --separator:       #D3DAD8;
  --fill-hover:      rgba(14,90,82,.04);
  --accent:          #0E5A52;
  --accent-emphasis: #094A43;
  --accent-fill:     #E2EDEA;
  --amber:           #A9740C;
  --amber-soft:      #FAF0DC;
  --alert:           #98352A;
  --alert-soft:      #F8E7E4;
  --shadow-card:     0 1px 3px rgba(0,0,0,.04);
  --shadow-float:    0 8px 28px rgba(0,0,0,.12);
  --material:        rgba(255,255,255,.72);

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "SF Pro Display", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  --type-hero:    clamp(34px, 3.8vw, 56px);
  --type-display: clamp(26px, 2.8vw, 40px);
  --type-title:   clamp(19px, 1.6vw, 24px);
  --type-lead:    clamp(17px, 1.4vw, 20px);
  --type-body:    17px;
  --type-caption: 13px;
  --type-label:   12px;

  --tracking-hero:  -.025em;
  --tracking-title: -.02em;
  --tracking-body:  -.01em;
  --tracking-label:  .06em;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --safe-x: clamp(24px, 5.2vw, 80px);
  --safe-y: clamp(20px, 3.2vh, 42px);
  --sidebar-w: 280px;
  --measure: 940px;

  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 22px; --r-pill: 980px;
  --ease: cubic-bezier(.28,.11,.32,1);
  --dur-fast: .18s; --dur: .3s; --dur-slow: .5s;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: var(--type-body);
  letter-spacing: var(--tracking-body); background: var(--bg-secondary);
  color: var(--label); -webkit-font-smoothing: antialiased; overflow: hidden;
}
h1,h2,h3,h4,p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
.icon {
  width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── 레이아웃 ── */
.app { display: flex; height: 100vh; }

/* ── 사이드바 ── */
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  display: flex; flex-direction: column;
  background: var(--bg-secondary); border-right: 1px solid var(--separator);
  transition: margin-left var(--dur) var(--ease), opacity var(--dur-fast) var(--ease);
}
body.is-collapsed .sidebar { margin-left: calc(var(--sidebar-w) * -1); opacity: 0; }
.sidebar__head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-5) 20px var(--sp-4);
}
.sidebar__eyebrow {
  font-size: var(--type-label); font-weight: 600; letter-spacing: var(--tracking-label);
  color: var(--accent); text-transform: uppercase; margin-bottom: var(--sp-1);
}
.sidebar__title { font-size: 19px; font-weight: 700; letter-spacing: var(--tracking-title); }
.icon-btn {
  display: grid; place-items: center; width: 32px; height: 32px;
  border-radius: var(--r-sm); color: var(--label-tertiary);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn:hover { background: var(--accent-fill); color: var(--accent); }
.stage__expand {
  position: absolute; top: 14px; left: 14px; z-index: 5;
  opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease);
}
body.is-collapsed .stage__expand { opacity: 1; pointer-events: auto; }

/* ── 사이드바 내비 ── */
.sidebar__nav {
  flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px var(--sp-4);
  scrollbar-width: thin;
}
.sidebar__nav::-webkit-scrollbar { width: 6px; }
.sidebar__nav::-webkit-scrollbar-thumb { background: var(--separator); border-radius: 3px; }
.nav__group {
  display: flex; align-items: center; gap: var(--sp-2);
  width: 100%; text-align: left;
  font-size: 11px; font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase;
  color: var(--label-tertiary); padding: var(--sp-4) var(--sp-2) var(--sp-2);
  transition: color var(--dur-fast) var(--ease);
}
.nav__group:hover { color: var(--label); }
.nav__item {
  position: relative; display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; text-align: left; padding: 8px var(--sp-3); margin-bottom: 1px;
  border-radius: var(--r-md); transition: background var(--dur-fast) var(--ease);
}
.nav__item:hover { background: var(--fill-hover); }
.nav__item.is-active { background: var(--accent-fill); }
.nav__item.is-active::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 3px; height: 22px; margin-top: -11px;
  border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav__item.is-active .nav__name { color: var(--accent); }
.nav__text { display: block; min-width: 0; }
.nav__name { display: block; font-size: 14px; font-weight: 600; letter-spacing: var(--tracking-body); }
.nav__desc {
  display: block; font-size: var(--type-caption); font-weight: 400; color: var(--label-tertiary);
  margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── 진행률 ── */
.sidebar__foot { padding: var(--sp-4) 20px 18px; border-top: 1px solid var(--separator); }
.progress__label { font-size: 11px; font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--label-tertiary); }
.progress__track { height: 3px; border-radius: 2px; background: var(--separator); margin: var(--sp-2) 0 7px; overflow: hidden; }
.progress__bar { height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width var(--dur) var(--ease); }
.progress__count { font-size: var(--type-caption); color: var(--label-secondary); font-variant-numeric: tabular-nums; }
.progress__count b { color: var(--label); font-weight: 600; }

/* ── 스테이지 ── */
.stage {
  position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column; background: var(--bg);
}
.stage__topbar, .stage__footbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--safe-y) var(--safe-x);
  font-size: var(--type-caption); font-weight: 400; color: var(--label-tertiary);
  font-variant-numeric: tabular-nums; flex: 0 0 auto;
}
.stage__footbar { justify-content: flex-end; }
.stage__slide {
  flex: 1; min-height: 0; overflow: hidden;
  padding: 0 var(--safe-x);
  display: flex; flex-direction: column; justify-content: center;
}
.stage__slide.scrollable { overflow-y: auto; justify-content: flex-start; padding-top: var(--sp-5); padding-bottom: var(--sp-8); }
@keyframes slide-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.slide { animation: slide-in var(--dur-slow) var(--ease) both; max-width: 1120px; width: 100%; }

/* ── 장표 텍스트 ── */
.slide__eyebrow { font-size: 15px; font-weight: 600; letter-spacing: var(--tracking-body); color: var(--accent); margin-bottom: 10px; }
.slide__title { font-size: var(--type-hero); font-weight: 700; letter-spacing: var(--tracking-hero); line-height: 1.05; text-wrap: balance; }
.slide__lead {
  font-size: var(--type-lead); font-weight: 500; letter-spacing: var(--tracking-title);
  line-height: 1.45; margin-top: var(--sp-5); color: var(--label-secondary);
  max-width: var(--measure); text-wrap: pretty;
}
.slide__lead b { color: var(--label); font-weight: 600; }
.slide__body { margin-top: var(--sp-6); }

/* ── 표지 ── */
.stage[data-layout="cover"]::after {
  content: ""; position: absolute; top: -14%; right: -12%;
  width: min(52vw, 640px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(14,90,82,.12), rgba(14,90,82,.03) 62%, rgba(14,90,82,0) 78%);
  pointer-events: none; z-index: 0;
}
.stage[data-layout="cover"]::before {
  content: ""; position: absolute; bottom: -16%; right: 2%;
  width: min(34vw, 400px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(14,90,82,.06), rgba(14,90,82,0) 70%);
  pointer-events: none; z-index: 0;
}
.stage__topbar, .stage__slide, .stage__footbar, .dock { position: relative; z-index: 1; }
.slide--cover .slide__title { font-size: clamp(38px,4.6vw,64px); line-height: 1.04; margin-top: var(--sp-2); }
.slide--cover .slide__lead { margin-top: var(--sp-4); max-width: 680px; }
.slide--cover .slide__body { margin-top: var(--sp-6); }
.cover-info { display: grid; gap: 4px; }
.cover-info__name { font-size: 26px; font-weight: 700; letter-spacing: var(--tracking-title); }
.cover-info__sub { font-size: 17px; font-weight: 500; color: var(--accent); }

/* ── 플로우 칩 ── */
.flow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: var(--sp-5); }
.flow span {
  background: var(--bg-elevated); border: 1px solid var(--separator);
  border-radius: var(--r-pill); padding: 9px 18px; font-size: 15px; font-weight: 500;
}
.flow i { font-style: normal; color: var(--label-tertiary); font-size: 14px; }

/* ── 카드 ── */
.cards { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card {
  padding: var(--sp-5) 28px; border-radius: var(--r-lg);
  background: var(--bg-elevated); border: 1px solid var(--separator); box-shadow: var(--shadow-card);
}
.card__label { font-size: var(--type-caption); font-weight: 600; letter-spacing: .04em; color: var(--accent); margin-bottom: 10px; }
.card__title { font-size: var(--type-title); font-weight: 600; letter-spacing: var(--tracking-title); line-height: 1.2; }
.card__body { font-size: 16px; font-weight: 400; line-height: 1.65; color: var(--label-secondary); margin-top: 10px; }
.card__body b { color: var(--label); font-weight: 600; }

/* ── 불릿 ── */
.bullets { display: grid; gap: 16px; max-width: var(--measure); }
.bullet { display: flex; gap: 14px; align-items: baseline; }
.bullet__dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-3px); }
.bullet__text { font-size: clamp(16px, 1.4vw, 19px); font-weight: 400; line-height: 1.55; color: var(--label-secondary); }
.bullet__text b { color: var(--label); font-weight: 600; }

/* ── 프롬프트 블록 ── */
.prompt {
  background: #0F1D23; border-radius: var(--r-lg); padding: 20px 22px;
  margin-bottom: 16px; position: relative;
}
.prompt__tag { color: #7FA8A0; font-size: var(--type-label); font-weight: 600; margin-bottom: 8px; }
.prompt pre {
  margin: 0; color: #DCE6E4; font-size: 14px; line-height: 1.68;
  white-space: pre-wrap; word-break: break-word; font-family: var(--font); padding-right: 76px;
}
.copy-btn {
  position: absolute; top: 16px; right: 16px;
  background: #1E3A3B; color: #CFE3DF; border: 1px solid #2E5453;
  border-radius: 7px; padding: 6px 13px; font: inherit; font-size: var(--type-caption);
  cursor: pointer; transition: background .15s;
}
.copy-btn:hover { background: #2A5150; }
.copy-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── 노트/경고 ── */
.note-box {
  border-left: 3px solid var(--amber); background: var(--amber-soft);
  padding: 14px 18px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  margin-top: 16px; font-size: 15px; line-height: 1.6; color: var(--label-secondary);
}
.note-box b { color: var(--label); font-weight: 700; }
.stop-box {
  border-left: 3px solid var(--alert); background: var(--alert-soft);
  padding: 14px 18px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  margin-top: 16px; font-size: 15px; line-height: 1.6; color: var(--label-secondary);
}
.stop-box b { color: var(--label); font-weight: 700; }

/* ── 사다리(아코디언) ── */
.ladder {
  border: 1px solid var(--separator); border-radius: var(--r-lg);
  overflow: hidden; background: var(--bg-elevated);
}
.ladder .row { border-bottom: 1px solid var(--separator); }
.ladder .row:last-child { border-bottom: 0; }
.ladder .row-btn {
  width: 100%; text-align: left; background: none; border: 0; font: inherit;
  cursor: pointer; padding: 14px 20px; display: flex; gap: 14px; align-items: center;
  color: var(--label); transition: background var(--dur-fast) var(--ease);
}
.ladder .row-btn:hover { background: #F6F9F8; }
.step-n {
  flex: 0 0 26px; height: 26px; border-radius: 50%;
  background: var(--accent-fill); color: var(--accent);
  font-size: var(--type-caption); font-weight: 700; display: grid; place-items: center;
}
.ladder .row-body {
  display: none; padding: 0 20px 16px 60px;
  color: var(--label-secondary); font-size: 15px; line-height: 1.6;
}
.ladder .row.open .row-body { display: block; }
.ladder .row.open .row-btn { background: #F6F9F8; }
.chev { margin-left: auto; color: var(--label-tertiary); font-size: var(--type-caption); }

/* ── 체크리스트 ── */
.check-list { list-style: none; padding: 0; margin: 0; }
.check-list li {
  padding: 12px 0 12px 32px; position: relative;
  border-bottom: 1px dashed var(--separator); font-size: 16px; line-height: 1.55;
  color: var(--label-secondary);
}
.check-list li:last-child { border-bottom: 0; }
.check-list li::before {
  content: ""; position: absolute; left: 0; top: 20px;
  width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 4px;
}
.check-list li b { color: var(--label); font-weight: 700; }

/* ── 제출 양식 ── */
.form-sheet { background: var(--bg-elevated); border: 1px solid var(--separator); border-radius: var(--r-lg); overflow: hidden; }
.form-item {
  display: grid; grid-template-columns: 30px 1fr; gap: 14px;
  padding: 14px 22px; border-bottom: 1px solid var(--separator);
  font-size: 15px; line-height: 1.6;
}
.form-item:last-child { border-bottom: 0; }
.form-n { color: var(--accent); font-weight: 700; }
.form-t { display: block; font-weight: 600; color: var(--label); }
.form-d { display: block; color: var(--label-tertiary); font-size: 14px; margin-top: 2px; }
.form-eg {
  display: block; margin-top: 8px; padding: 10px 14px;
  background: var(--bg-secondary); border-radius: var(--r-sm);
  font-size: 14px; line-height: 1.66; color: var(--label-secondary);
}
.mono {
  font-family: var(--font-mono); font-size: 13px;
  background: var(--bg-secondary); border: 1px solid var(--separator);
  border-radius: 5px; padding: 2px 7px; display: inline-block;
}

/* ── statement ── */
.statement {
  font-size: var(--type-display); font-weight: 600;
  letter-spacing: var(--tracking-title); line-height: 1.3;
  padding-left: var(--sp-5); border-left: 3px solid var(--accent); text-wrap: balance;
}

/* ── 예시 그리드 ── */
.ex-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; margin-bottom: 14px; }
.ex-grid > div { background: var(--bg-secondary); border-radius: var(--r-sm); padding: 14px 16px; font-size: 15px; line-height: 1.55; color: var(--label-secondary); }
.ex-grid h4 { margin: 0 0 5px; font-size: var(--type-caption); color: var(--accent); font-weight: 700; }

/* ── 플로팅 독 ── */
.dock {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px;
  padding: 6px var(--sp-2); border-radius: var(--r-pill);
  background: var(--material); border: 1px solid var(--separator);
  box-shadow: var(--shadow-float);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  transition: opacity var(--dur) var(--ease);
}
.dock:not(:hover) { opacity: .55; }
.dock__btn {
  display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
  color: var(--label);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
.dock__btn:hover { background: var(--accent-fill); color: var(--accent); }
.dock__btn:disabled { opacity: .28; cursor: default; }
.dock__btn:disabled:hover { background: none; color: var(--label); }

@media (max-width: 1100px) { .ex-grid { grid-template-columns: 1fr; } }
@media (max-width: 860px) { :root { --sidebar-w: 240px; } }
@media (max-width: 640px) {
  .sidebar { position: fixed; z-index: 30; height: 100%; box-shadow: var(--shadow-float); }
  .stage__slide { justify-content: flex-start; padding-top: var(--sp-3); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <header class="sidebar__head">
      <div class="sidebar__brand">
        <p class="sidebar__eyebrow">예방의학 실습</p>
        <h1 class="sidebar__title">근거중심 답변찾기</h1>
      </div>
      <button class="icon-btn" id="collapseBtn" title="사이드바 접기" aria-label="사이드바 접기">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
      </button>
    </header>
    <nav class="sidebar__nav" id="nav"></nav>
    <footer class="sidebar__foot">
      <p class="progress__label">Progress</p>
      <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
      <p class="progress__count"><b id="progressNow">1</b> / <span id="progressTotal"></span></p>
    </footer>
  </aside>

  <main class="stage" id="stage">
    <button class="icon-btn stage__expand" id="expandBtn" title="사이드바 펼치기" aria-label="사이드바 펼치기">
      <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
    </button>
    <div class="stage__topbar">
      <span id="crumbSection"></span>
      <span id="crumbDeck">근거중심 답변찾기</span>
    </div>
    <div class="stage__slide" id="slideContainer"></div>
    <div class="stage__footbar"><span id="footPage"></span></div>
    <div class="dock">
      <button class="dock__btn" id="prevBtn" title="이전 (←)"><svg viewBox="0 0 24 24" class="icon"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="dock__btn" id="nextBtn" title="다음 (→)"><svg viewBox="0 0 24 24" class="icon"><polyline points="9 6 15 12 9 18"></polyline></svg></button>
    </div>
  </main>
</div>

<script>
const SLIDES = [
  /* ───── 표지 ───── */
  {
    id:"cover", section:"표지", layout:"cover",
    eyebrow:"예방의학 및 실습 · 근거중심 답변찾기",
    title:"환자가 물어본 걸\n근거로 확인하고,\n환자 말로 설명하기",
    lead:"AI가 요약은 잘해 줍니다. 대신 그 논문이 실제로 있는지, 눈앞의 환자에게 맞는 연구인지, 결과를 넘겨 말하고 있지 않은지는 여러분이 확인해야 합니다.",
    body:`<div class="flow">
      <span>환자 질문</span><i>→</i>
      <span>PICO</span><i>→</i>
      <span>검색</span><i>→</i>
      <span>논문 1편</span><i>→</i>
      <span>환자 설명자료</span>
    </div>`
  },

  /* ───── 0. 준비 ───── */
  {

        <span class="form-eg">환자 질문: "어머니가 치매약 드시는데, 홍삼 같이 드시면 기억력에 도움이 될까요?"<br>P 알츠하이머 환자 / I 치매약 + 홍삼 / C 치매약만 / O 인지기능 점수</span></span></div>
      <div class="form-item"><span class="form-n">2</span><span><span class="form-t">검색식</span><span class="form-d">데이터베이스 이름과 최종 검색식</span>
        <span class="form-eg">DB: PubMed<br><span class="mono">"dementia"[Mesh] AND "Panax"[Mesh]</span></span></span></div>
      <div class="form-item"><span class="form-n">3</span><span><span class="form-t">검색결과</span><span class="form-d">건수 한 줄. 넓히거나 좁혔으면 변화만</span>
        <span class="form-eg">1차 "Alzheimer Disease"[Mesh]로 좁게 시작 → 상위 개념(dementia)으로 넓힘 → 81건 → RCT 1편 선택</span></span></div>
      <div class="form-item"><span class="form-n">4</span><span><span class="form-t">선택논문</span><span class="form-d">제목, 저널, 연도, PMID</span>
        <span class="form-eg">Heo JH, et al. An open-label trial of Korean red ginseng… <i>Eur J Neurol</i>. 2008. PMID 18684311</span></span></div>
      <div class="form-item"><span class="form-n">5</span><span><span class="form-t">간단요약</span><span class="form-d">누구를 / 무엇과 비교 / 결과 / 한계, 네 줄</span>
        <span class="form-eg">누구를: 치매약 복용 중 알츠하이머 환자 61명, 12주<br>비교: 홍삼 4.5g vs 9g vs 치매약만<br>결과: 고용량군 ADAS(p=0.032), CDR(p=0.006) 개선<br>한계: 표본 적음, 공개 라벨</span></span></div>
      <div class="form-item"><span class="form-n">6</span><span><span class="form-t">환자 설명</span><span class="form-d">시각자료 한두 개 + 30초 멘트</span></span></div>
      <div class="form-item"><span class="form-n">+</span><span><span class="form-t">AI 사용 한 줄</span><span class="form-d">어디에 썼는지, AI가 틀린 게 있었다면 무엇을 어떻게 확인했는지</span></span></div>
    </div>`

    body:`<div class="ex-grid">

/* ── 렌더링 ── */
let current = 0;

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '';
  let lastSec = '';
  SLIDES.forEach((s, i) => {
    if (s.section !== lastSec) {
      lastSec = s.section;
      html += `<div class="nav__group"><span>${s.section}</span></div>`;
    }
    const t = (s.title || '').replace(/\n/g, ' ');
    html += `<button class="nav__item" data-index="${i}">
      <span class="nav__text">
        <span class="nav__name">${t}</span>
        <span class="nav__desc">${s.section}</span>
      </span>
    </button>`;
  });
  nav.innerHTML = html;
  document.getElementById('progressTotal').textContent = SLIDES.length;
}

function renderSlide(index) {
  const s = SLIDES[index];
  const container = document.getElementById('slideContainer');
  const stage = document.getElementById('stage');
  stage.removeAttribute('data-layout');
  if (s.layout === 'cover') stage.setAttribute('data-layout', 'cover');

  container.className = 'stage__slide' + (s.scrollable ? ' scrollable' : '');

  const nl2br = (str) => String(str||'').replace(/\n/g,'<br>');
  container.innerHTML = `
    <article class="slide slide--${s.layout||'default'}" id="slide-${s.id}">
      ${s.eyebrow ? `<p class="slide__eyebrow">${s.eyebrow}</p>` : ''}
      ${s.title ? `<h2 class="slide__title">${nl2br(s.title)}</h2>` : ''}
      ${s.lead ? `<p class="slide__lead">${s.lead}</p>` : ''}
      ${s.body ? `<div class="slide__body">${s.body}</div>` : ''}
    </article>`;

  document.getElementById('crumbSection').textContent = s.section;
  document.getElementById('footPage').textContent = `${String(index+1).padStart(2,'0')} / ${SLIDES.length}`;
  document.getElementById('progressBar').style.width = `${((index+1)/SLIDES.length)*100}%`;
  document.getElementById('progressNow').textContent = index + 1;
  document.querySelectorAll('.nav__item').forEach((el) => {
    el.classList.toggle('is-active', Number(el.dataset.index) === index);
  });
  // 활성 nav 항목이 보이도록 스크롤
  const activeNav = document.querySelector('.nav__item.is-active');
  if (activeNav) activeNav.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === SLIDES.length - 1;
  current = index;
}

function go(i) { if (i >= 0 && i < SLIDES.length) renderSlide(i); }

/* ── 아코디언 ── */
function toggleRow(btn) {
  const row = btn.closest('.row');
  row.classList.toggle('open');
  btn.querySelector('.chev').textContent = row.classList.contains('open') ? '접기' : '펼치기';
}

/* ── 복사 ── */
function copyPrompt(btn) {
  const pre = btn.closest('.prompt').querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = '복사됨'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('done'); }, 1500);
  });
}

/* ── 이벤트 ── */
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  renderSlide(0);
  document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));
  document.getElementById('nav').addEventListener('click', (e) => {
    const btn = e.target.closest('.nav__item');
    if (btn) go(Number(btn.dataset.index));
  });
  document.getElementById('collapseBtn').addEventListener('click', () => document.body.classList.add('is-collapsed'));
  document.getElementById('expandBtn').addEventListener('click', () => document.body.classList.remove('is-collapsed'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); go(current + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(current - 1); }
    if (e.key === '\\') document.body.classList.toggle('is-collapsed');
  });
});
</script>
